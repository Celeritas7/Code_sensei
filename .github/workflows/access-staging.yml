name: Account isolation staging
on:
  pull_request:
    paths: ['access/**', 'tests/**', 'package*.json', 'playwright.config.mjs', '.github/workflows/access-staging.yml', 'index.html', 'js/compose.js']
  push:
    branches: [main]
    paths: ['access/**', 'tests/**', 'package*.json', 'playwright.config.mjs', '.github/workflows/access-staging.yml', 'index.html', 'js/compose.js']
permissions:
  contents: read
jobs:
  synthetic-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      # No hosted project credentials, deployment or real enrollment.
      - uses: actions/upload-artifact@v4
        with:
          name: code-sensei-synthetic-staging
          path: .staging/
          include-hidden-files: true
